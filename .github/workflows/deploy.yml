name: Test, Build & Deploy

on:
  push:
    branches: [main]

# Deux poussees rapprochees ecriraient sinon dans le meme dossier en meme temps.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy on VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} "mkdir -p /opt/chevrollier-tools/site"
          # --delay-updates bascule tous les fichiers a la fin : la page ne
          # reclame jamais un asset hache pas encore arrive.
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ root@${{ secrets.VPS_HOST }}:/opt/chevrollier-tools/site/
